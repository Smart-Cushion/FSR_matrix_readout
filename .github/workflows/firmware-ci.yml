name: Firmware CI

on:
  push:
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20

      - name: Check formatting
        working-directory: internal_adc/firmware
        run: |
          clang-format-20 --version
          find main -type f \( -name '*.c' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format-20 --dry-run --Werror

  build:
    name: ESP-IDF build
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: internal_adc/firmware
